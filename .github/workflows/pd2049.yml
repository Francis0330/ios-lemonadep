name: pd2049

# iQOO 7 / PD2049 (SM8350, Adreno 660) XNU build.
# The lemonadep/sweet overlays are ADT-driven; PD2049-specific hardware
# values are supplied at runtime by the PD2049 ADT generated by
# ios_port_pd2049/port/build_pd2049_adt.py. This workflow builds the kernel
# with a PD2049-targeted artifact name on the same macos-14/Xcode 15 runner
# required by xnu-8796.

on:
  workflow_dispatch:
    inputs:
      build_kernel:
        description: Build XNU (macOS runner)
        type: boolean
        default: true
      macos_version:
        description: macOS release whose xnu to build
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      keep_going:
        description: make -k
        default: "true"
  push:
    branches: [pd2049]
    paths:
      - "xnu/patches/**"
      - "lemonadep/xnu/patches/**"
      - "pd2049/**"
      - ".github/workflows/pd2049.yml"

concurrency:
  group: pd2049-${{ github.ref }}
  cancel-in-progress: false

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: SWEET

jobs:
  shim:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu device-tree-compiler cpio clang qemu-user
          git init -q "$RUNNER_TEMP/mkbootimg"
          git -C "$RUNNER_TEMP/mkbootimg" fetch -q --depth 1 https://android.googlesource.com/platform/system/tools/mkbootimg 028bdc06ce87ab1ee23204feb5cd5ee406484618
          git -C "$RUNNER_TEMP/mkbootimg" checkout -q FETCH_HEAD
      - name: Build PD2049 shim
        env:
          BOARD: pd2049
          MKBOOTIMG: python3 ${{ runner.temp }}/mkbootimg/mkbootimg.py
        run: bash shim/build.sh
      - name: Upload shim
        uses: actions/upload-artifact@v4
        with:
          name: shim-pd2049
          path: |
            shim/out/pd2049/Image
            shim/out/pd2049/shim.elf
            shim/out/pd2049/shim-boot-pd2049.img
          if-no-files-found: warn

  kernel:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.build_kernel) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[kernel]'))
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script and apply patches
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          cp xnu/patches/*.patch dxb/patches/
          if ls xnu/patches/*.sh >/dev/null 2>&1; then cp xnu/patches/*.sh dxb/patches/; fi
          shopt -s nullglob
          for p in lemonadep/xnu/patches/*.patch; do cp "$p" dxb/patches/; done
          for p in pd2049/xnu/patches/*.patch; do cp "$p" dxb/patches/; done
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Build
        working-directory: dxb
        env:
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: bash build.sh

      - name: Verify overlay markers
        if: always()
        run: |
          set -e
          T=dxb/xnu
          grep -q 'BA_VIDEO_BASE' "$T/osfmk/arm64/genassym.c"
          grep -q 'sweet_early_setup(args)' "$T/osfmk/arm/arm_init.c"
          grep -q 'sweet_gicr_priority_writes' "$T/pexpert/arm/pe_fiq.c"
          grep -q 'sweet_el1_ptimer' "$T/osfmk/arm64/machine_routines.c"
          grep -q 'keys_pon_ppid_override' "$T/bsd/dev/sweet_keys.c"
          grep -q 'touch_tcm_bringup' "$T/bsd/dev/sweet_touch.c"

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel-pd2049
          path: out/
          if-no-files-found: warn
